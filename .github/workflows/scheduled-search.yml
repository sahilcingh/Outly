name: Scheduled job search

# Runs the job search + Telegram digest directly on GitHub's runners instead
# of pinging the Render backend — Render's free tier hibernates and its
# wake-up is unreliable (confirmed: even a keep-alive ping failed), so the
# search needs to run somewhere that doesn't depend on waking anything up.
# Talks straight to Postgres/Groq/Telegram, same as the Render backend does.
on:
  schedule:
    # Queued 45 min early (off the congested :00 mark) because GitHub delays
    # scheduled runs; the "Wait until target time" step holds the run until
    # exactly 9:30 AM / 2:30 PM IST so the delay is absorbed, not added.
    - cron: "45 3 * * 1-6"  # queued 9:15 AM IST, runs 9:30 AM IST, Mon-Sat
    - cron: "45 8 * * 1-6"  # queued 2:15 PM IST, runs 2:30 PM IST, Mon-Sat
  workflow_dispatch: {}      # lets you trigger it manually from the Actions tab

jobs:
  run-search:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SCHEDULER_USER_ID: ${{ secrets.SCHEDULER_USER_ID }}
      CANDIDATE_LEVEL: ${{ secrets.CANDIDATE_LEVEL }}
      SENIORITY_STRICT: ${{ secrets.SENIORITY_STRICT }}
      JOB_LOCATIONS: ${{ secrets.JOB_LOCATIONS }}
      JOB_HOURS_FRESH: ${{ secrets.JOB_HOURS_FRESH }}
      JOB_HOURS_OLD: ${{ secrets.JOB_HOURS_OLD }}
      JOB_EXTRA_KEYWORDS: ${{ secrets.JOB_EXTRA_KEYWORDS }}
      MIN_MATCH_SCORE: ${{ secrets.MIN_MATCH_SCORE }}
      MIN_MATCH_SCORE_ENTRY: ${{ secrets.MIN_MATCH_SCORE_ENTRY }}
      BLOCKED_COMPANIES: ${{ secrets.BLOCKED_COMPANIES }}
      BLOCK_INTERNSHIPS: ${{ secrets.BLOCK_INTERNSHIPS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Wait until target time (IST)
        if: github.event_name == 'schedule'
        run: |
          case "${{ github.event.schedule }}" in
            "45 3 * * 1-6") T="09:30" ;;
            *) T="14:30" ;;
          esac
          target=$(TZ=Asia/Kolkata date -d "today $T" +%s)
          wait=$((target - $(date +%s)))
          echo "Waiting ${wait}s until $T IST"
          if [ "$wait" -gt 0 ] && [ "$wait" -lt 3600 ]; then sleep "$wait"; fi

      - name: Run scheduled search
        run: python -c "from scheduler.job_runner import run_scheduled_search; run_scheduled_search()"
